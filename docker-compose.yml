services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldatlas
      POSTGRES_PASSWORD: fieldatlas
      POSTGRES_DB: fieldatlas
    ports:
      - '5432:5432'
    volumes:
      - fieldatlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fieldatlas -d fieldatlas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldatlas_pg:
